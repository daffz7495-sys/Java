<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pemesanan Barang | Java Jamu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="css/utama.css">
</head>
<body class="glass-body min-h-screen flex flex-col justify-between">

    <header class="sticky top-4 z-40 max-w-5xl mx-auto px-6 w-full">
        <nav class="glass-card px-6 py-3.5 rounded-full flex justify-between items-center">
            <a href="index.html" class="font-extrabold text-lg tracking-tight text-emerald-950 flex items-center gap-2">
                <i data-lucide="leaf" class="w-5 h-5 text-emerald-600"></i> Java Jamu
            </a>
            <div class="hidden md:flex gap-8 text-sm font-semibold text-zinc-600">
                <a href="index.html" class="hover:text-emerald-700 transition">Beranda</a>
                <a href="produk.html" class="hover:text-emerald-700 transition">Produk</a>
                <a href="pemesanan.html" class="text-emerald-800 font-bold">Pemesanan</a>
                <a href="tentang.html" class="hover:text-emerald-700 transition">Tentang</a>
                <a href="kontak.html" class="hover:text-emerald-700 transition">Kontak</a>
            </div>
            <a href="produk.html" class="bg-emerald-800 text-white px-5 py-2 rounded-full text-xs font-bold shadow-md hover:bg-emerald-900 transition">
                Lihat Produk
            </a>
        </nav>
    </header>

    <main class="flex-grow max-w-2xl mx-auto px-6 py-12 w-full">
        <div class="text-center mb-8">
            <span class="text-xs font-bold tracking-widest text-emerald-700 uppercase">FORMULIR ONLINE</span>
            <h1 class="text-3xl font-extrabold text-emerald-950 mt-1">Pemesanan Barang</h1>
            <p class="text-zinc-600 text-xs mt-1">Silakan isi formulir di bawah untuk memesan produk Java Jamu.</p>
        </div>

        <form action="#" method="post" class="glass-card p-6 md:p-8 rounded-3xl space-y-6 shadow-xl border border-white/60">
            <!-- Data Pelanggan -->
            <div>
                <h2 class="font-bold text-emerald-950 text-sm uppercase tracking-wider mb-4 border-b pb-2 border-zinc-200 flex items-center gap-2">
                    <i data-lucide="user" class="w-4 h-4 text-emerald-600"></i> Data Pelanggan
                </h2>
                <div class="space-y-3">
                    <div>
                        <label for="nama" class="block text-xs font-bold text-zinc-600 mb-1">Nama Lengkap</label>
                        <input type="text" id="nama" name="nama" placeholder="Masukkan nama lengkap" required class="w-full bg-white/70 border border-zinc-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-emerald-600">
                    </div>
                    <div>
                        <label for="telepon" class="block text-xs font-bold text-zinc-600 mb-1">Nomor Telepon / WA</label>
                        <input type="tel" id="telepon" name="telepon" placeholder="08xxxxxxxxxx" required class="w-full bg-white/70 border border-zinc-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-emerald-600">
                    </div>
                    <div>
                        <label for="alamat" class="block text-xs font-bold text-zinc-600 mb-1">Alamat Lengkap</label>
                        <textarea id="alamat" name="alamat" rows="3" placeholder="Masukkan alamat pengiriman..." required class="w-full bg-white/70 border border-zinc-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-emerald-600"></textarea>
                    </div>
                </div>
            </div>

            <!-- Detail Pesanan -->
            <div>
                <h2 class="font-bold text-emerald-950 text-sm uppercase tracking-wider mb-4 border-b pb-2 border-zinc-200 flex items-center gap-2">
                    <i data-lucide="shopping-bag" class="w-4 h-4 text-emerald-600"></i> Detail Pesanan
                </h2>
                <div class="grid md:grid-cols-2 gap-3">
                    <div>
                        <label for="produk" class="block text-xs font-bold text-zinc-600 mb-1">Pilih Produk</label>
                        <select id="produk" name="produk" required class="w-full bg-white/70 border border-zinc-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-emerald-600">
                            <option value="">-- Pilih Produk --</option>
                            <option value="Kunyit Asam">Kunyit Asam - Rp8.000</option>
                            <option value="Beras Kencur">Beras Kencur - Rp8.000</option>
                            <option value="Temulawak">Temulawak - Rp8.000</option>
                        </select>
                    </div>
                    <div>
                        <label for="jumlah" class="block text-xs font-bold text-zinc-600 mb-1">Jumlah</label>
                        <input type="number" id="jumlah" name="jumlah" min="1" placeholder="1" required class="w-full bg-white/70 border border-zinc-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-emerald-600">
                    </div>
                </div>
                <div class="mt-3">
                    <label for="catatan" class="block text-xs font-bold text-zinc-600 mb-1">Catatan Tambahan (Opsional)</label>
                    <textarea id="catatan" name="catatan" rows="2" placeholder="Catatan khusus..." class="w-full bg-white/70 border border-zinc-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-emerald-600"></textarea>
                </div>
            </div>

            <!-- Metode Pembayaran -->
            <div>
                <h2 class="font-bold text-emerald-950 text-sm uppercase tracking-wider mb-3 border-b pb-2 border-zinc-200 flex items-center gap-2">
                    <i data-lucide="credit-card" class="w-4 h-4 text-emerald-600"></i> Metode Pembayaran
                </h2>
                <div class="grid grid-cols-3 gap-2">
                    <label class="bg-white/70 border border-zinc-200 p-3 rounded-xl flex items-center gap-2 text-xs font-bold text-zinc-700 cursor-pointer">
                        <input type="radio" id="tunai" name="pembayaran" value="Tunai" required class="text-emerald-600"> Tunai (COD)
                    </label>
                    <label class="bg-white/70 border border-zinc-200 p-3 rounded-xl flex items-center gap-2 text-xs font-bold text-zinc-700 cursor-pointer">
                        <input type="radio" id="transfer" name="pembayaran" value="Transfer" class="text-emerald-600"> Transfer
                    </label>
                    <label class="bg-white/70 border border-zinc-200 p-3 rounded-xl flex items-center gap-2 text-xs font-bold text-zinc-700 cursor-pointer">
                        <input type="radio" id="ewallet" name="pembayaran" value="E-Wallet" class="text-emerald-600"> E-Wallet
                    </label>
                </div>
            </div>

            <!-- Tombol Submit -->
            <div class="flex gap-3 pt-2">
                <button type="submit" class="flex-1 bg-emerald-800 text-white py-3 rounded-xl font-bold text-xs shadow-md hover:bg-emerald-900 transition">
                    Kirim Pesanan
                </button>
                <button type="reset" class="bg-zinc-200 text-zinc-700 px-6 py-3 rounded-xl font-bold text-xs hover:bg-zinc-300 transition">
                    Reset
                </button>
            </div>
        </form>
    </main>

    <footer class="footer border-t border-white/40 bg-white/30 backdrop-blur-md py-8 text-center text-xs text-zinc-500">
        <h2 class="font-bold text-emerald-950 text-base mb-1">Java Jamu</h2>
        <p class="text-emerald-700 font-semibold mb-3">SEDUH • NIKMATI • CERITAKAN</p>
        <p>© 2026 Java Jamu. Semua hak dilindungi.</p>
    </footer>

    <script>lucide.createIcons();</script>
</body>
</html>
